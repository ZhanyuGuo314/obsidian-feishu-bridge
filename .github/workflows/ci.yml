name: Tests and public export

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install '.[dev]'
      - run: python -m ruff check --select F,I src tests scripts
      - run: python -m ruff format --check src tests scripts
      - run: python scripts/sync_skill.py --check
      - run: python scripts/check_public.py
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - name: Check distribution archives
        shell: python
        run: |
          import pathlib, subprocess, sys
          for path in pathlib.Path('dist').iterdir():
              subprocess.run([sys.executable, 'scripts/check_public.py', '--archive', str(path)], check=True)
